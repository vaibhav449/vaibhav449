<svg xmlns="http://www.w3.org/2000/svg" width="410" height="299" viewBox="0 0 410 299" role="img" aria-label="Case 01: Retently - AI-native study workspace: notes in, spaced-repetition reviews out."><title>Case 01: Retently - AI-native study workspace: notes in, spaced-repetition reviews out.</title><style>text{font-family:'JetBrains Mono','SFMono-Regular','SF Mono',Menlo,Consolas,'Liberation Mono',monospace}.blink{animation:blink 1.1s steps(1) infinite}@keyframes blink{50%{opacity:0}}.pulse{animation:pulse 2.4s ease-in-out infinite}@keyframes pulse{50%{opacity:.3}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}.lap0{stroke-dasharray:24 76;animation:lap0 6s linear infinite}@keyframes lap0{from{stroke-dashoffset:24}to{stroke-dashoffset:-76}}.lap1{stroke-dasharray:10 90;animation:lap1 6s linear infinite}@keyframes lap1{from{stroke-dashoffset:10}to{stroke-dashoffset:-90}}.lap2{stroke-dasharray:2.5 97.5;animation:lap2 6s linear infinite}@keyframes lap2{from{stroke-dashoffset:2.5}to{stroke-dashoffset:-97.5}}@media (prefers-reduced-motion:reduce){.comet{display:none}}</style><defs><filter id="glow" filterUnits="userSpaceOnUse" x="0" y="0" width="410" height="299"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="bloom" filterUnits="userSpaceOnUse" x="0" y="0" width="410" height="299"><feGaussianBlur stdDeviation="6"/></filter><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#0c1821" stroke-width="1"/></pattern><pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#ffffff" opacity=".03"/></pattern></defs><rect width="410" height="299" rx="12" fill="#05070c"/><rect width="410" height="299" rx="12" fill="url(#grid)"/><path d="M1 1H124L136 24H1Z" fill="#ff007f" fill-opacity=".12"/><path d="M124 1L136 24H1" fill="none" stroke="#ff007f" stroke-width="1"/><text x="16.0" y="17.0" font-size="10.5" fill="#ff007f" letter-spacing="2" font-weight="700">CASE 01</text><circle class="pulse" cx="322.4" cy="14.5" r="3" fill="#39ff9e"/><text x="376.0" y="18.0" font-size="10" fill="#39ff9e" letter-spacing="1.5" text-anchor="end">ACTIVE</text><g fill="none" stroke="#00f3ff" stroke-width="1.90" stroke-linecap="square" stroke-linejoin="miter" filter="url(#glow)"><path d="M20.0 57.0 L20.0 38.0 L29.5 38.0 L32.7 41.2 L32.7 44.3 L29.5 47.5 L20.0 47.5"/><path d="M26.3 47.5 L32.7 57.0"/><path d="M50.7 38.0 L38.0 38.0 L38.0 57.0 L50.7 57.0"/><path d="M38.0 47.5 L47.5 47.5"/><path d="M56.1 38.0 L68.8 38.0"/><path d="M62.4 38.0 L62.4 57.0"/><path d="M86.8 38.0 L74.1 38.0 L74.1 57.0 L86.8 57.0"/><path d="M74.1 47.5 L83.6 47.5"/><path d="M92.2 57.0 L92.2 38.0 L104.9 57.0 L104.9 38.0"/><path d="M110.2 38.0 L122.9 38.0"/><path d="M116.6 38.0 L116.6 57.0"/><path d="M128.3 38.0 L128.3 57.0 L141.0 57.0"/><path d="M146.3 38.0 L146.3 44.3 L152.7 48.8 L159.0 44.3 L159.0 38.0"/><path d="M152.7 48.8 L152.7 57.0"/></g><text x="20.0" y="84.0" font-size="12.5" fill="#dcf7ff">AI-native study workspace: notes in,</text><text x="20.0" y="101.0" font-size="12.5" fill="#dcf7ff">spaced-repetition reviews out.</text><text x="20.0" y="130.0" font-size="11.5" fill="#ff007f">▸</text><text x="36.0" y="130.0" font-size="11" fill="#a8cad8">Turborepo monorepo: Next.js 16 web, WebSocket</text><text x="36.0" y="145.0" font-size="11" fill="#a8cad8">realtime, RabbitMQ worker</text><text x="20.0" y="167.0" font-size="11.5" fill="#ff007f">▸</text><text x="36.0" y="167.0" font-size="11" fill="#a8cad8">Failed jobs retry, then park in a parking-lot queue</text><text x="36.0" y="182.0" font-size="11" fill="#a8cad8">for inspection</text><text x="20.0" y="204.0" font-size="11.5" fill="#ff007f">▸</text><text x="36.0" y="204.0" font-size="11" fill="#a8cad8">Pure, swappable schedulers (FSRS-6, SM-2) over</text><text x="36.0" y="219.0" font-size="11" fill="#a8cad8">Postgres + pgvector</text><path d="M25.0 241H76.7V254L71.7 259H20.0V246Z" fill="none" stroke="#24414e" stroke-width="1"/><text x="48.3" y="253.6" font-size="10" fill="#86a9b8" text-anchor="middle">Next.js</text><path d="M87.7 241H145.5V254L140.5 259H82.7V246Z" fill="none" stroke="#24414e" stroke-width="1"/><text x="114.1" y="253.6" font-size="10" fill="#86a9b8" text-anchor="middle">RabbitMQ</text><path d="M156.5 241H214.3V254L209.3 259H151.5V246Z" fill="none" stroke="#24414e" stroke-width="1"/><text x="182.9" y="253.6" font-size="10" fill="#86a9b8" text-anchor="middle">pgvector</text><path d="M225.3 241H270.9V254L265.9 259H220.3V246Z" fill="none" stroke="#24414e" stroke-width="1"/><text x="245.6" y="253.6" font-size="10" fill="#86a9b8" text-anchor="middle">Prisma</text><path d="M20 269.5H390" stroke="#14242f"/><text x="20.0" y="286.0" font-size="9.5" fill="#4b6a78" letter-spacing="1.2">LAST PUSH 2026-11-25</text><text x="390.0" y="286.0" font-size="10" fill="#ff007f" letter-spacing="1.5" font-weight="700" text-anchor="end">OPEN FILE ↗</text><g class="comet" filter="url(#glow)"><path class="lap0" d="M12 1H398A11 11 0 0 1 409 12V287A11 11 0 0 1 398 298H12A11 11 0 0 1 1 287V12A11 11 0 0 1 12 1Z" pathLength="100" fill="none" stroke="#ff007f" stroke-width="1.6" stroke-linecap="round" opacity="0.4" style="animation-delay:-0.00s"/><path class="lap1" d="M12 1H398A11 11 0 0 1 409 12V287A11 11 0 0 1 398 298H12A11 11 0 0 1 1 287V12A11 11 0 0 1 12 1Z" pathLength="100" fill="none" stroke="#00f3ff" stroke-width="2" stroke-linecap="round" opacity="0.75" style="animation-delay:-0.00s"/><path class="lap2" d="M12 1H398A11 11 0 0 1 409 12V287A11 11 0 0 1 398 298H12A11 11 0 0 1 1 287V12A11 11 0 0 1 12 1Z" pathLength="100" fill="none" stroke="#e8fdff" stroke-width="2.8" stroke-linecap="round" opacity="1" style="animation-delay:-0.00s"/></g><rect width="410" height="299" rx="12" fill="url(#scan)"/></svg>