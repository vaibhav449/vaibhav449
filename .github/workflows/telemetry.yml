name: Telemetry sync

on:
  schedule:
    - cron: "23 0 * * *" # daily, 00:23 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/telemetry.yml"

permissions:
  contents: write

concurrency:
  group: telemetry
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Render panels from live GitHub data
        run: python3 scripts/render.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_USER: ${{ github.repository_owner }}

      - name: Commit changed panels
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          if git diff --cached --quiet; then
            echo "Panels unchanged"
            exit 0
          fi
          git commit -m "chore: sync telemetry panels [skip ci]"
          git push
